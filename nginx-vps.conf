# Configuração para o domínio ordemdoseraphim.com
# Este arquivo é uma REFERÊNCIA para a configuração que o EasyPanel gerencia automaticamente.

# Bloco 1: Redirecionamento permanente (301) de non-www para www
server {
    listen 80;
    listen [::]:80;
    server_name ordemdoseraphim.com;
    return 301 https://www.ordemdoseraphim.com$request_uri;
}

# Bloco 2: Configuração principal para www.ordemdoseraphim.com
server {
    listen 80;
    listen [::]:80;

    server_name www.ordemdoseraphim.com;

    # Caminho para os arquivos estáticos do frontend
    root /var/www/ordemdoseraphim.com/frontend/dist;
    index index.html;

    # Configuração para servir os arquivos estáticos e lidar com o roteamento do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para a API Backend
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Otimizações e Segurança
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
