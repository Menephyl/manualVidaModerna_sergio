# Configuração para o domínio ordemdoseraphim.com
# Este arquivo deve ser colocado em /etc/nginx/sites-available/ordemdoseraphim.com na sua VPS

# Bloco 1: Redirecionamento permanente (301) de non-www para www
# Isso é bom para SEO e para manter a consistência da URL.
server {
    listen 80;
    listen [::]:80;
    server_name ordemdoseraphim.com;
    return 301 https://www.ordemdoseraphim.com$request_uri;
}

# Bloco 2: Configuração principal para www.ordemdoseraphim.com
server {
    # Escuta na porta 80 para tráfego HTTP (o Certbot cuidará do HTTPS)
    listen 80;
    listen [::]:80;

    # Domínios que este bloco de servidor irá responder
    server_name www.ordemdoseraphim.com;

    # Caminho para os arquivos estáticos do frontend (após o build)
    # Assumindo que o projeto está em /var/www/ordemdoseraphim.com
    root /var/www/ordemdoseraphim.com/frontend/dist;
    index index.html;

    # Configuração para servir os arquivos estáticos e lidar com o roteamento do React
    location / {
        # Tenta encontrar o arquivo solicitado. Se não encontrar,
        # serve o index.html para que o React Router possa lidar com a rota.
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para a API Backend
    # Todas as requisições para /api/... serão redirecionadas para o backend Node.js
    location /api {
        proxy_pass http://localhost:3001; # A porta definida no ecosystem.config.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Otimizações e Segurança

    # Habilita compressão gzip para acelerar o carregamento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Impede que o site seja renderizado dentro de um <iframe> em outros domínios
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}